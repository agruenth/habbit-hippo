name: habbit_hippo
description: Your hippo companion that grows with your wellbeing.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.7

  # Health data (HealthKit + Health Connect)
  health: ^12.0.0

  # Local DB (offline-first)
  drift: ^2.18.0
  drift_flutter: ^0.2.0

  # Network
  dio: ^5.4.3+1

  # Secure storage (JWT tokens)
  flutter_secure_storage: ^9.2.2

  # Animations
  rive: ^0.13.14

  # Background tasks
  workmanager: ^0.5.2

  # WebSocket
  web_socket_channel: ^2.4.5

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.3
  drift_dev: ^2.18.0
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/images/
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Nunito-Black.ttf
          weight: 900
